<title>Probe Mind-Map Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   Probe — design tokens
   ground/ink neutrals carry a slight teal bias; the accent is a
   deep sonar teal, amber marks assumptions, rose marks challenge.
   ───────────────────────────────────────────────────────────── */
:root {
  --ground:      #EDF1F0;
  --surface:     #FFFFFF;
  --surface-2:   #F5F8F7;
  --line:        #D2DCD9;
  --line-strong: #B4C3BF;
  --ink:         #131E1B;
  --ink-soft:    #536260;
  --ink-faint:   #5E6D69;

  --probe:       #0B655C;
  --probe-soft:  #DCEDEA;
  --probe-ink:   #084A43;
  --on-probe:    #FFFFFF;

  --amber:       #855A02;
  --amber-soft:  #F7EBD2;
  --rose:        #A03F58;
  --rose-soft:   #F7E3E8;
  --green:       #2C6E4E;

  --shadow-sm: 0 1px 2px rgba(19,30,27,.06), 0 2px 8px rgba(19,30,27,.05);
  --shadow-md: 0 4px 12px rgba(19,30,27,.10), 0 12px 32px rgba(19,30,27,.08);

  --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

  --r-sm: 4px; --r-md: 8px; --r-lg: 14px;
  --step: 4px;
}
:root:not([data-theme="light"]) {
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0D1413;
    --surface:     #141D1B;
    --surface-2:   #1A2523;
    --line:        #26332F;
    --line-strong: #3A4A46;
    --ink:         #E4EBE8;
    --ink-soft:    #9AAAA5;
    --ink-faint:   #8B9A95;

    --probe:       #4CC3B1;
    --probe-soft:  #16332F;
    --probe-ink:   #8FE0D2;
    --on-probe:    #06201D;

    --amber:       #D9A441;
    --amber-soft:  #33280F;
    --rose:        #E08199;
    --rose-soft:   #331A20;
    --green:       #63BC8E;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0D1413;
  --surface:     #141D1B;
  --surface-2:   #1A2523;
  --line:        #26332F;
  --line-strong: #3A4A46;
  --ink:         #E4EBE8;
  --ink-soft:    #9AAAA5;
  --ink-faint:   #8B9A95;

  --probe:       #4CC3B1;
  --probe-soft:  #16332F;
  --probe-ink:   #8FE0D2;
  --on-probe:    #06201D;

  --amber:       #D9A441;
  --amber-soft:  #33280F;
  --rose:        #E08199;
  --rose-soft:   #331A20;
  --green:       #63BC8E;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--probe); outline-offset: 2px; border-radius: var(--r-sm); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ── shared atoms ─────────────────────────────────────────── */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13.5px; font-weight: 500;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--probe); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--primary {
  background: var(--probe); border-color: var(--probe); color: var(--on-probe);
}
.btn--primary:hover:not(:disabled) { background: var(--probe-ink); border-color: var(--probe-ink); color: var(--ground); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.btn--sm { padding: 4px 9px; font-size: 12.5px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--ink-soft);
  white-space: nowrap; max-width: 100%;
}
.chip--assumption { white-space: normal; text-align: left; }
.chip--user   { border-color: var(--probe); color: var(--probe); background: var(--probe-soft); }
.chip--model  { border-color: var(--line-strong); color: var(--ink-faint); }
.chip--assumption { border-style: dashed; border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
.chip--live   { border-color: var(--probe); color: var(--probe); background: var(--probe-soft); }
.chip--recorded { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }

/* confidence encodes level in shape as well as colour */
.conf { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.conf i {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block;
  border: 1.5px solid currentColor;
}
.conf--high   { color: var(--green); }
.conf--high i { background: currentColor; }
.conf--medium { color: var(--amber); }
.conf--medium i { background: linear-gradient(to right, currentColor 50%, transparent 50%); }
.conf--low    { color: var(--rose); }
.conf--low i  { background: transparent; border-style: dashed; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

/* ── app frame ────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
  flex-wrap: wrap;
}
.brandmark { display: flex; align-items: center; gap: 9px; }
.brandmark svg { display: block; }
.brandmark b { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.brandmark span { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; }
.topbar__spacer { flex: 1 1 auto; }
.topbar__tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* stepper: the four states genuinely are a sequence */
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper__item {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
  padding: 3px 9px; border-radius: 999px; border: 1px solid transparent;
}
.stepper__item b { font-weight: 500; }
.stepper__item--done { color: var(--ink-soft); }
.stepper__item--now { color: var(--probe); border-color: var(--probe); background: var(--probe-soft); }
.stepper__sep { color: var(--line-strong); font-size: 11px; }

.trustline {
  padding: 7px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-soft);
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
}
.trustline strong { color: var(--ink); font-weight: 600; }

.main { flex: 1 1 auto; display: flex; min-height: 0; }

/* on the map screen the chrome stays put and the canvas scrolls inside it */
.app--map { height: 100vh; }
.app--map .main { overflow: hidden; }
.app--map .canvas, .app--map .inspector { overflow: auto; }
.stage { flex: 1 1 auto; min-width: 0; padding: 24px 18px 60px; }
.stage--center { display: flex; justify-content: center; }

/* ── brief screen ─────────────────────────────────────────── */
.brief { width: min(860px, 100%); display: flex; flex-direction: column; gap: 18px; }
.brief__head h1 {
  font-family: var(--serif); font-size: clamp(28px, 4vw, 40px); font-weight: 500;
  letter-spacing: -.02em; line-height: 1.12; margin: 8px 0 6px;
}
.brief__head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.brief__panel { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--ink-faint); }
textarea, input[type="text"], input[type="password"], select {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface-2); color: var(--ink);
  resize: vertical;
}
textarea:focus, input:focus, select:focus { border-color: var(--probe); outline: none; background: var(--surface); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .field { flex: 1 1 180px; min-width: 0; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }
.example {
  text-align: left; cursor: pointer;
  border: 1px dashed var(--line-strong); border-radius: var(--r-md);
  background: transparent; padding: 8px 11px; font-size: 12.5px; color: var(--ink-soft);
  max-width: 260px;
}
.example:hover { border-color: var(--probe); color: var(--probe); background: var(--probe-soft); }
.example b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }
.example:hover b { color: var(--probe); }

.expectations { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; overflow: hidden; }
.expectations > div { padding: 16px 18px; }
.expectations > div + div { border-left: 1px solid var(--line); }
.expectations h3 { font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.expectations ul { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 5px; }
.expectations li { font-size: 13px; color: var(--ink-soft); }
.expectations .yes h3 { color: var(--probe); }
.expectations .no h3 { color: var(--rose); }
@media (max-width: 620px) { .expectations > div + div { border-left: none; border-top: 1px solid var(--line); } }

/* ── clarify screen ───────────────────────────────────────── */
.clarify { width: min(760px, 100%); display: flex; flex-direction: column; gap: 14px; }
.clarify__head { display: flex; flex-direction: column; gap: 6px; }
.clarify__head h2 { font-family: var(--serif); font-size: 26px; font-weight: 500; }
.q { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.q__top { display: flex; gap: 10px; align-items: flex-start; }
.q__n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding-top: 3px; }
.q__text { font-size: 15.5px; font-weight: 600; flex: 1; }
.q__why { font-size: 12.5px; color: var(--ink-soft); font-style: italic; }
.q__suggestions { display: flex; gap: 6px; flex-wrap: wrap; }
.sugg {
  cursor: pointer; padding: 5px 10px; font-size: 12.5px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2);
}
.sugg:hover { border-color: var(--probe); color: var(--probe); }
.sugg[aria-pressed="true"] { background: var(--probe); border-color: var(--probe); color: var(--on-probe); }
.q__foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q--skipped { background: var(--surface-2); }
.q--skipped .q__text { color: var(--ink-soft); }
.skipnote { font-size: 12px; color: var(--amber); font-family: var(--mono); }

/* ── map workspace ────────────────────────────────────────── */
.mapscreen { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; width: 100%; }
.workspace { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; width: 100%; }
.canvas {
  flex: 1 1 auto; min-width: 0; overflow: auto;
  padding: 22px 18px 80px;
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
  background-size: 22px 22px;
}
.maphead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.maphead > div { min-width: 0; }
.maphead h2 { font-family: var(--serif); font-size: 22px; font-weight: 500; }
.maphead p { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); max-width: 70ch; }

.tree { display: flex; flex-direction: column; gap: 4px; padding-left: 2px; }
.branch { position: relative; padding-left: 22px; }
.branch::before {
  content: ""; position: absolute; left: 8px; top: 0; bottom: 12px;
  border-left: 1px solid var(--line-strong);
}
.node { display: flex; align-items: flex-start; gap: 7px; position: relative; padding: 2px 0; }
.node::before {
  content: ""; position: absolute; left: -14px; top: 17px; width: 13px;
  border-top: 1px solid var(--line-strong);
}
.tree > .node::before { display: none; }
.node__toggle {
  width: 18px; height: 18px; margin-top: 6px; flex: 0 0 auto;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; color: var(--ink-soft);
  display: grid; place-items: center; font-size: 11px; line-height: 1;
  font-family: var(--mono);
}
.node__toggle:hover { border-color: var(--probe); color: var(--probe); }
.node__toggle--hidden { visibility: hidden; }
.node__body {
  flex: 0 1 auto; min-width: 0; max-width: min(720px, 100%);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 5px 10px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); cursor: pointer;
  transition: border-color .12s, box-shadow .12s, background .12s;
}
.node__body:hover { border-color: var(--probe); }
.node--selected > .node__body { border-color: var(--probe); box-shadow: 0 0 0 2px var(--probe-soft); }
.node--root > .node__body {
  background: var(--probe); border-color: var(--probe);
  padding: 9px 14px;
}
.node--root .node__label { font-family: var(--serif); font-size: 19px; color: var(--on-probe); }
.node--l1 > .node__body { border-left: 3px solid var(--probe); }
.node__label { font-size: 14px; font-weight: 500; }
.node--l1 .node__label { font-size: 15px; font-weight: 600; }
.node__label[contenteditable="true"] {
  outline: none; border-bottom: 1px dashed var(--probe); min-width: 40px;
}
.node__meta { display: flex; align-items: center; gap: 6px; margin-left: 12px; }
.node__flag { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: var(--r-sm); }
.node--locked > .node__body { background: var(--surface-2); border-style: solid; border-color: var(--probe); }
.node--added > .node__body { box-shadow: -3px 0 0 var(--green); }
.node--changed > .node__body { box-shadow: -3px 0 0 var(--amber); }
.node--voted-up > .node__body { border-color: var(--green); }
.node--voted-down > .node__body { border-color: var(--rose); opacity: .72; }
.node__probecount {
  font-family: var(--mono); font-size: 10px; color: var(--rose);
  border: 1px solid var(--rose); border-radius: 999px; padding: 0 5px;
}

/* ── inspector ────────────────────────────────────────────── */
.inspector {
  flex: 0 0 340px; width: 340px;
  border-left: 1px solid var(--line);
  background: var(--surface);
  overflow: auto; padding: 18px 16px 60px;
  display: flex; flex-direction: column; gap: 16px;
}
.inspector__empty { color: var(--ink-faint); font-size: 13px; }
.insp__title { font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1.2; }
.insp__section { display: flex; flex-direction: column; gap: 7px; }
.insp__section > h4 { font-size: 12px; margin: 0; display: flex; align-items: center; gap: 6px; }
.insp__why { font-size: 13.5px; color: var(--ink-soft); }
.alt { border: 1px solid var(--line); border-left: 3px solid var(--probe); border-radius: var(--r-sm); padding: 8px 10px; }
.alt b { font-size: 13px; }
.alt p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
.alt__act { margin-top: 7px; }
.probe-q {
  border: 1px solid var(--rose); border-radius: var(--r-sm);
  background: var(--rose-soft); padding: 8px 10px; font-size: 13px;
}
.probe-q__ask { margin-top: 7px; display: flex; gap: 6px; }
.probe-q__ask input { flex: 1; }
.insp__controls { display: flex; gap: 6px; flex-wrap: wrap; }
.votebar { display: flex; gap: 6px; align-items: center; }

/* ── refine dock ──────────────────────────────────────────── */
.dock {
  position: sticky; bottom: 0;
  border-top: 1px solid var(--line); background: var(--surface);
  padding: 12px 18px; display: flex; flex-direction: column; gap: 9px;
  box-shadow: 0 -4px 16px rgba(19,30,27,.05);
}
.dock__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dock__q { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dock__q input { flex: 1 1 200px; min-width: 0; }
.ping {
  position: relative; width: 9px; height: 9px; border-radius: 50%;
  background: var(--rose); flex: 0 0 auto;
}
.ping::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--rose); animation: ping 2.4s ease-out infinite;
}
@keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ping::after { animation: none; } }

/* ── status / notices ─────────────────────────────────────── */
.notice {
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  border-left: 3px solid var(--amber);
}
.notice h3 { font-size: 14.5px; }
.notice p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.notice__acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 3px; }
.notice--error { border-left-color: var(--rose); }
.notice--info { border-left-color: var(--probe); }

.loading { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 28px 0; }
.loading__bar { width: 220px; height: 3px; background: var(--line); border-radius: 999px; overflow: hidden; }
.loading__bar i { display: block; height: 100%; width: 40%; background: var(--probe); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .loading__bar i { animation: none; width: 100%; } }
.loading__what { font-size: 13.5px; color: var(--ink-soft); }

.footbar {
  border-top: 1px solid var(--line); background: var(--surface-2);
  padding: 9px 18px; display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint);
  letter-spacing: .04em;
}

/* ── modal ────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(10,18,16,.5);
  display: grid; place-items: center; padding: 20px; z-index: 90;
}
.modal { width: min(620px, 100%); max-height: 86vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 13px; }
.modal h3 { font-family: var(--serif); font-size: 21px; font-weight: 500; }
.modal pre {
  margin: 0; padding: 12px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-md); font-family: var(--mono); font-size: 12px;
  overflow-x: auto; max-height: 46vh; white-space: pre; tab-size: 2;
}
.modal__acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 4px 10px; font-size: 12.5px; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 999px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--probe); border-color: var(--probe); color: var(--on-probe); }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--ground);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 120;
  box-shadow: var(--shadow-md);
}

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 900px) {
  .app--map { height: auto; }
  .app--map .main { overflow: visible; }
  .workspace { flex-direction: column; }
  .inspector { flex: 1 1 auto; width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 52vh; }
  .canvas { max-height: none; }
}

/* the assumptions a map rests on — marginalia, not badges */
.assumes {
  margin-top: 12px; padding: 10px 0 10px 13px;
  border-left: 2px dashed var(--amber);
  display: flex; flex-direction: column; gap: 5px;
  max-width: 68ch;
}
.assumes h4 { margin: 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.assumes li { font-size: 13px; color: var(--ink-soft); }
.assumes ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }

<script>
/* ─────────────────────────────────────────────────────────────
   Agent configuration — prompt pack v0.1 (2026-08-23)
   Every model call in the app comes from this object. Changing
   behaviour means changing a prompt here and bumping VERSION,
   so before/after iterations are traceable (see CHANGELOG-agent.md).
   ───────────────────────────────────────────────────────────── */
const PROMPTS = {
  VERSION: 'v0.2',

  /* The stance shared by every call: probe, don't please. */
  SYSTEM: [
    'You are Probe, a mind-mapping agent for people doing real planning and thinking work.',
    'Your job is NOT to produce a tidy, generic tree. A map that could have been written',
    'without reading the brief is a failed map.',
    '',
    'Operating rules:',
    '1. SPECIFICITY. Every node must be something a knowledgeable colleague would actually',
    '   say about THIS brief. Ban generic filler branches ("Planning", "Execution",',
    '   "Best Practices", "Challenges", "Future Scope") unless the brief itself is about them.',
    '2. CHALLENGE. For each major branch, name at least one alternative framing that a',
    '   reasonable expert would prefer instead, and say what it trades off.',
    '3. SURFACE ASSUMPTIONS. If you had to assume something to place a node, mark it',
    '   source:"assumption" and state the assumption in plain words. Never smuggle one in.',
    '4. CALIBRATE. confidence:"high" only for things that are well established for this',
    '   domain; "low" when you are extrapolating. Do not inflate.',
    '5. NO INVENTED FACTS. You have no web access here. Do not cite statistics, studies,',
    '   prices, dates or named sources. Speak from general domain knowledge and say so.',
    '6. PROBE. Probing questions must be answerable by the user and must change the map',
    '   if answered ("Which of these two audiences pays?"), not rhetorical filler',
    '   ("Have you considered your users?").',
    '',
    'Output rules: reply with a single JSON object and nothing else. No prose, no markdown',
    'fences, no trailing commentary. Use plain double quotes. Keep every string under 220',
    'characters.'
  ].join('\n'),

  /* Step 2 — seek context before mapping anything. */
  clarify(brief) {
    return [
      'A user gave this brief for a mind map:',
      '---',
      `Topic: ${brief.topic}`,
      `Purpose: ${brief.purpose}`,
      `Audience: ${brief.audience || 'not stated'}`,
      `Depth wanted: ${brief.depth} levels`,
      '---',
      '',
      'Before mapping, ask the 3–5 questions whose answers would most change the shape of',
      'the map. Prefer questions about scope boundaries, the decision behind the request,',
      'constraints, and which of several plausible framings applies. Skip anything you can',
      'reasonably infer from the brief — asking about the obvious wastes the user\'s time.',
      '',
      'For each question also give the default you will assume if the user skips it, so',
      'skipping is safe and visible.',
      '',
      'Return JSON exactly:',
      '{"questions":[{"id":"q1","question":"...","why":"one line: what this changes in the map",',
      '"suggestions":["short option","short option","short option"],"assumeIfSkipped":"the default you will use"}]}'
    ].join('\n');
  },

  /* Step 3 — build the map itself. */
  buildMap(brief, answers) {
    return [
      'Build the mind map now.',
      '',
      `Topic: ${brief.topic}`,
      `Purpose: ${brief.purpose}`,
      `Audience: ${brief.audience || 'not stated'}`,
      `Depth: ${brief.depth} levels below the centre.`,
      '',
      answers.length
        ? 'The user answered your clarifying questions:\n' +
          answers.map(a => `- ${a.question} → ${a.answered ? a.answer : `[SKIPPED — assume: ${a.assumeIfSkipped}]`}`).join('\n')
        : 'The user has not answered anything yet — you are mapping from the brief alone. ' +
          'Map it anyway rather than stalling: make the assumptions you need, mark every node that ' +
          'rests on one with source:"assumption", and list those assumptions in plain words in ' +
          '"assumptions" so the user can see exactly what to correct.',
      '',
      'Rules for this map:',
      `- 4 to 6 first-level branches. Each must be a real division of THIS topic, not a lifecycle stage borrowed from a template.`,
      '- 2 to 4 children per branch. Children are concrete: a method, a decision, a risk, a named option.',
      '- Anything that came from the user\'s answers gets source:"user". Anything resting on a',
      '  skipped question or your own guess gets source:"assumption". Everything else "model".',
      '- Give 2–3 "alternatives" on each first-level branch: a different way to cut this part of',
      '  the problem, each with the trade-off it makes.',
      '- Give 1–2 "probes" on each first-level branch: questions to the user that would change',
      '  this branch. At least one probe somewhere in the map must challenge the brief itself.',
      '',
      'Return JSON exactly:',
      '{"title":"short map title","summary":"2 sentences on how you cut the problem and why",',
      '"assumptions":["plain-words assumption you made"],',
      '"root":{"id":"n0","label":"centre","children":[',
      '{"id":"n1","label":"branch","why":"one line: why this branch exists",',
      '"confidence":"high|medium|low","source":"user|model|assumption",',
      '"alternatives":[{"label":"other framing","tradeoff":"what it gains / gives up"}],',
      '"probes":["question that would change this branch"],',
      '"children":[{"id":"n1a","label":"child","why":"...","confidence":"...","source":"...","children":[]}]}]}}'
    ].join('\n');
  },

  /* Step 4 — refine from the user's answer to a probe. */
  refine(brief, mapJson, exchange, lockedLabels) {
    return [
      'Revise the map using the user\'s answer below. This is an iteration, not a fresh start.',
      '',
      `Topic: ${brief.topic}`,
      'Current map (JSON):',
      mapJson,
      '',
      `The agent asked: ${exchange.question}`,
      `The user answered: ${exchange.answer}`,
      '',
      'Revision rules:',
      '- Keep the id of every node that survives, so the change can be shown as a diff.',
      '- Do not silently drop a branch: if the answer kills a branch, remove it and say so in "changeNote".',
      '- Promote anything the answer makes central; demote what it makes marginal.',
      '- Nodes the user locked must survive with their label unchanged: ' + (lockedLabels.length ? lockedLabels.join(' | ') : 'none'),
      '- Anything now grounded in the user\'s words becomes source:"user" with higher confidence.',
      '- Add at most 2 new probes, and make them harder than the last round.',
      '',
      'Return the same JSON shape as before, plus "changeNote":"1–2 lines on what you changed and why".'
    ].join('\n');
  },

  /* Optional expansion of one branch. */
  deepen(brief, nodeLabel, pathLabels) {
    return [
      `Topic: ${brief.topic}`,
      `Expand exactly one branch: "${nodeLabel}" (path: ${pathLabels.join(' › ')}).`,
      'Add 2–4 children that are specific enough to act on this week — a method, a decision,',
      'a named option, or a risk with a trigger. No restating the parent in other words.',
      'Include one child that a careful person would consider and reject, marked confidence:"low",',
      'with "why" explaining when it would actually be the right call.',
      '',
      'Return JSON exactly:',
      '{"children":[{"id":"new1","label":"...","why":"...","confidence":"high|medium|low",',
      '"source":"model|assumption","children":[]}]}'
    ].join('\n');
  },

  /* Guardrail: refuse to map nothing. */
  BRIEF_TOO_THIN: 'Give me a bit more to work with — a sentence saying what you are trying to decide, plan or understand. "Marketing" or "AI" is a category, not a brief, and mapping it would just give you a generic tree.'
};

/* ─────────────────────────────────────────────────────────────
   Probe — application logic
   Two run modes, one code path:
     live      → calls the Anthropic API with the viewer's own key
     recorded  → replays saved outputs of the same prompts
   Everything after generation (editing, locking, undo, diffing,
   export) is local and identical in both modes.
   ───────────────────────────────────────────────────────────── */

const LS = {
  get(k, d) { try { const v = localStorage.getItem('probe.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('probe.' + k, v); } catch (e) { /* private mode */ } },
  del(k) { try { localStorage.removeItem('probe.' + k); } catch (e) {} }
};

    return /(^|\.)claude\.ai$|claudeusercontent\.com$|artifacts?\..*anthropic/.test(location.hostname);
  } catch (e) { return false; }

/* ── tree helpers ─────────────────────────────────────────── */
function walk(node, fn, depth, parent) {
  depth = depth || 0;
  fn(node, depth, parent || null);
  (node.children || []).forEach(c => walk(c, fn, depth + 1, node));
}
function findNode(id, node) {
  node = node || S.map;
  if (!node) return null;
  let hit = null;
  walk(node, n => { if (n.id === id) hit = n; });
  return hit;
}
function findParent(id) {
  let hit = null;
  walk(S.map, (n, d, p) => { if (n.id === id) hit = p; });
  return hit;
}
function snapshot() {
  if (!S.map) return;
  S.history.push(stateShot());
  if (S.history.length > 40) S.history.shift();
  S.future = [];
}
function stateShot() {
  return {
    map: clone(S.map), assumptions: clone(S.assumptions),
    resolved: clone(S.resolvedAssumptions), extra: clone(S.extraAssumptions),
    changeNote: S.changeNote
  };
}
function restoreShot(shot) {
  S.map = shot.map; S.assumptions = shot.assumptions;
  S.resolvedAssumptions = shot.resolved || []; S.extraAssumptions = shot.extra || [];
  S.changeNote = shot.changeNote;
}

function newId(prefix) {
  let i = 1, id;
  do { id = (prefix || 'x') + i++; } while (findNode(id));
  return id;
}
function normalise(node, seen) {
  seen = seen || new Set();
  if (!node.id || seen.has(node.id)) node.id = 'g' + Math.random().toString(36).slice(2, 7);
  seen.add(node.id);
  node.label = String(node.label || 'Untitled').slice(0, 200);
  node.why = String(node.why || '');
  if (['high', 'medium', 'low'].indexOf(node.confidence) < 0) node.confidence = 'medium';
  if (['user', 'model', 'assumption'].indexOf(node.source) < 0) node.source = 'model';
  node.alternatives = Array.isArray(node.alternatives) ? node.alternatives.filter(a => a && a.label) : [];
  node.probes = Array.isArray(node.probes) ? node.probes.filter(p => typeof p === 'string') : [];
  node.children = Array.isArray(node.children) ? node.children : [];
  node.children.forEach(c => normalise(c, seen));
  return node;
}

/* ── diffing: what changed between two versions of the map ─── */
function markDiff(before, after) {
  const old = {};
  if (before) walk(before, n => { old[n.id] = n.label; });
  walk(after, n => {
    if (!(n.id in old)) n.status = 'added';
    else if (old[n.id] !== n.label) n.status = 'changed';
    else n.status = null;
  });
  return after;
}
function clearDiff() { if (S.map) walk(S.map, n => { n.status = null; }); }

/* ── model access (live mode) ─────────────────────────────── */
function extractJson(text) {
  let t = String(text || '').trim();
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No JSON object found in the reply.');
  return JSON.parse(t.slice(a, b + 1));
}

async function anthropic(userPrompt, opts) {
  opts = opts || {};
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), opts.timeout || 90000);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': S.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: S.model,
        max_tokens: opts.maxTokens || 4000,
        system: PROMPTS.SYSTEM,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      const err = new Error('api_' + res.status);
      err.status = res.status;
      err.detail = detail.slice(0, 300);
      throw err;
    }
    const data = await res.json();
    return (data.content || []).map(b => b.text || '').join('');
  } finally { clearTimeout(timer); }
}

  for (let i = 0; i < 3; i++) {
    try {
      const prompt = i === 0 ? userPrompt
        : userPrompt + '\n\nYour previous reply could not be used: ' + attempts[attempts.length - 1] +
          '\nReturn only the JSON object described above, nothing else.';
      raw = await anthropic(prompt, opts);
      const parsed = extractJson(raw);
      const problem = validate(parsed);
      if (problem) throw new Error(problem);
      logEvent('model_call', { ok: true, attempt: i + 1, model: S.model });
      return parsed;
    } catch (e) {
      attempts.push(e.message);
      logEvent('model_call', { ok: false, attempt: i + 1, error: e.message });
      if (e.name === 'AbortError') throw tagged(e, 'timeout');
      if (e.status === 401) throw tagged(e, 'auth');
      if (e.status === 429) { await wait(1200 * (i + 1)); continue; }
      if (e.status >= 500) { await wait(900 * (i + 1)); continue; }
      if (e.message === 'Failed to fetch' || e.name === 'TypeError') throw tagged(e, 'network');
      await wait(400);
    }
  }
  throw tagged(new Error(attempts.join(' | ')), 'unusable');
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function tagged(e, kind) { e.kind = kind; return e; }

/* ── validators: never render a shape we did not check ────── */
function validateClarify(o) {
  if (!o || !Array.isArray(o.questions) || !o.questions.length) return 'no questions array';
  o.questions = o.questions.filter(q => q && q.question).slice(0, 6);
  if (!o.questions.length) return 'questions were empty';
  o.questions.forEach((q, i) => {
    q.id = q.id || ('q' + (i + 1));
    q.suggestions = Array.isArray(q.suggestions) ? q.suggestions.slice(0, 4) : [];
    q.assumeIfSkipped = q.assumeIfSkipped || 'no default stated — treat this as unknown';
    q.why = q.why || '';
  });
  return null;
}
function validateMap(o) {
  if (!o || !o.root || !o.root.label) return 'no root node';
  if (!Array.isArray(o.root.children) || o.root.children.length < 2) return 'root has fewer than two branches';
  o.assumptions = Array.isArray(o.assumptions) ? o.assumptions : [];
  o.title = o.title || S.brief.topic.slice(0, 60);
  o.summary = o.summary || '';
  normalise(o.root);
  return null;
}
function validateChildren(o) {
  if (!o || !Array.isArray(o.children) || !o.children.length) return 'no children returned';
  o.children.forEach(c => normalise(c));
  return null;
}

/* ── recorded mode ────────────────────────────────────────── */
function recordedCase(id) { return RECORDED.filter(c => c.id === id)[0] || null; }

function applyOps(map, ops) {
  ops.forEach(op => {
    if (op.set) {
      const n = findNode(op.set.id, map);
      if (n) Object.keys(op.set).forEach(k => { if (k !== 'id') n[k] = op.set[k]; });
    } else if (op.add) {
      const p = findNode(op.add.parentId, map);
      if (p) p.children.push(clone(op.add.node));
    } else if (op.remove) {
      const p = findParent(op.remove);
      if (p) p.children = p.children.filter(c => c.id !== op.remove);
    } else if (op.addProbe) {
      const n = findNode(op.addProbe.id, map);
      if (n) n.probes = (n.probes || []).concat([op.addProbe.probe]);
    }
  });
  return map;
}

/* the map arrives open one level deep; deeper branches expand on click */
function collapseBelow(depth) {
  walk(S.map, (n, d) => { n.collapsed = d >= depth && (n.children || []).length > 0; });
}
function setAllCollapsed(state) {
  walk(S.map, (n, d) => { if (d > 0 && (n.children || []).length) n.collapsed = state; });
}
function installMap(out) {
  S.map = out.root;
  S.title = out.title;
  S.summary = out.summary;
  S.assumptions = (out.assumptions || []).slice();
  S.resolvedAssumptions = [];
  S.extraAssumptions = [];
  S.changeNote = '';
  S.refineRound = 0;
  collapseBelow(2);
  S.screen = 'map';
  S.selectedId = S.map.children[0] ? S.map.children[0].id : null;
}
/* what the map is currently resting on: base assumptions minus the ones an
   answer retired, plus the defaults created by skipping a question outright */
function assumptionsShown() {
  return dedupe(S.assumptions.filter(a => S.resolvedAssumptions.indexOf(a) < 0).concat(S.extraAssumptions));
}

/* ── flow: brief → map (questions come with it, not before it) ─────── */
async function startFlow(askFirst) {
  const topic = S.brief.topic.trim();
  if (topic.split(/\s+/).length < 4 || topic.length < 20) {
    S.error = { title: 'That brief is too thin to map well', body: PROMPTS.BRIEF_TOO_THIN,
      actions: [{ label: 'Edit the brief', act: 'dismiss' }] };
    logEvent('guardrail', { reason: 'brief_too_thin' });
    return render();
  }

  if (!isLive()) {
    if (!S.caseId) {
      S.error = {
        title: 'This build can only run the three recorded briefs',
        body: LIVE_BLOCKED
          ? 'Live calls are blocked inside a shared artifact preview, so your own brief cannot be generated here. Pick a recorded example below to see the full flow, or run the file locally with your own Anthropic key.'
          : 'Add your Anthropic API key in Settings to map your own brief, or pick one of the recorded examples.',
        actions: [{ label: 'Pick a recorded example', act: 'dismiss' }].concat(LIVE_BLOCKED ? [] : [{ label: 'Open settings', act: 'settings' }])
      };
      logEvent('mode_limit', { blocked: LIVE_BLOCKED });
      return render();
    }
    const c = recordedCase(S.caseId);
    S.questions = clone(c.questions);
    S.answers = {};
    if (askFirst) {
      S.screen = 'clarify';
      logEvent('clarify_shown', { mode: 'recorded', n: S.questions.length });
      return render();
    }
    const m = clone(c.map);
    normalise(m.root);
    installMap(m);
    logEvent('map_built', { mode: 'recorded', firstStep: 'map', nodes: countNodes(), openQuestions: S.questions.length });
    return render();
  }

  if (askFirst) {
    return guarded('Working out what your brief does not tell me', async () => {
      const out = await askModel(PROMPTS.clarify(S.brief), validateClarify, { maxTokens: 1500 });
      S.questions = out.questions;
      S.answers = {};
      S.screen = 'clarify';
      logEvent('clarify_shown', { mode: 'live', n: S.questions.length });
    });
  }

  /* the default: map and questions are produced in parallel, so the map is
     on screen in one step and the questions arrive with it */
  await guarded('Mapping your brief — and working out what it does not tell me', async () => {
    const [clar, mapOut] = await Promise.all([
      askModel(PROMPTS.clarify(S.brief), validateClarify, { maxTokens: 1500 }),
      askModel(PROMPTS.buildMap(S.brief, []), validateMap, { maxTokens: 6000 })
    ]);
    S.questions = clar.questions;
    S.answers = {};
    installMap(mapOut);
    logEvent('map_built', { mode: 'live', firstStep: 'map', nodes: countNodes(), openQuestions: S.questions.length });
  });
}

/* ── flow: clarify → map (only when the user asked to be asked first) ─ */
async function buildMap() {
  const answers = S.questions.map(q => {
    const a = S.answers[q.id];
    return {
      question: q.question,
      answered: !!(a && a.answer && a.answer.trim()),
      answer: a ? a.answer : '',
      assumeIfSkipped: q.assumeIfSkipped
    };
  });
  const skipped = answers.filter(a => !a.answered).length;
  logEvent('answers_submitted', { answered: answers.length - skipped, skipped: skipped });

  if (!isLive()) {
    const c = recordedCase(S.caseId);
    const m = clone(c.map);
    normalise(m.root);
    installMap(m);
    S.extraAssumptions = S.questions.filter(q => !(S.answers[q.id] || {}).answer).map(q => q.assumeIfSkipped);
    applyAnsweredQuestionsLocally();
    logEvent('map_built', { mode: 'recorded', firstStep: 'clarify', nodes: countNodes() });
    return render();
  }
  await guarded('Building the map, then challenging it', async () => {
    const out = await askModel(PROMPTS.buildMap(S.brief, answers), validateMap, { maxTokens: 6000 });
    installMap(out);
    S.extraAssumptions = S.questions.filter(q => !(S.answers[q.id] || {}).answer).map(q => q.assumeIfSkipped);
    logEvent('map_built', { mode: 'live', firstStep: 'clarify', nodes: countNodes() });
  });
}

/* ask-first + recorded: fold the answers already given into the recorded map */
function applyAnsweredQuestionsLocally() {
  S.questions.forEach(q => {
    const a = (S.answers[q.id] || {}).answer;
    if (!a || !q.effect) return;
    applyOps(S.map, fillOps(q.effect.ops, a));
    if (typeof q.effect.resolves === 'number') {
      const t = S.assumptions[q.effect.resolves];
      if (t) S.resolvedAssumptions.push(t);
    }
  });
}

/* the user's own words go into the nodes an answer touches */
function fill(text, answer) {
  return String(text).replace(/\{\{answer\}\}/g, String(answer).replace(/\s+/g, ' ').trim());
}
function fillOps(ops, answer) {
  return clone(ops || []).map(op => {
    if (op.set && op.set.why) op.set.why = fill(op.set.why, answer);
    if (op.addProbe) op.addProbe.probe = fill(op.addProbe.probe, answer);
    if (op.add && op.add.node && op.add.node.why) op.add.node.why = fill(op.add.node.why, answer);
    return op;
  });
}

/* two phrasings of the same assumption should not both show */
function dedupe(list) {
  const seen = {}, out = [];
  list.filter(Boolean).forEach(a => {
    const key = String(a).toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).slice(0, 6).join(' ');
    if (!seen[key]) { seen[key] = true; out.push(a); }
  });
  return out;
}

function countNodes() { let c = 0; if (S.map) walk(S.map, () => c++); return c; }

/* ── refinement: one path, whether the answer came from a question or a probe ── */
async function applyAnswer(question, answer, opts) {
  opts = opts || {};
  if (!answer || !answer.trim()) return;
  answer = answer.trim();
  logEvent('answer_given', { kind: opts.kind || 'probe', node: opts.nodeId || null, question: question, answer: answer });
  const before = clone(S.map);

  if (!isLive()) {
    const rec = opts.recorded;
    if (!rec) {
      S.error = {
        title: 'No recorded rework for that one',
        body: 'Recorded mode replays saved runs, so it can only rework the questions and probes it has a recording for — every clarifying question, and the probes marked ●. Your answer is still in the session log.',
        actions: [{ label: 'Show me one that is recorded', act: 'jump-recorded' }, { label: 'Close', act: 'dismiss' }]
      };
      return render();
    }
    snapshot();
    applyOps(S.map, fillOps(rec.ops, answer));
    if (typeof rec.resolves === 'number') {
      const t = S.assumptions[rec.resolves];
      if (t && S.resolvedAssumptions.indexOf(t) < 0) S.resolvedAssumptions.push(t);
    }
    markDiff(before, S.map);
    S.changeNote = fill(rec.note, answer);
    S.refineRound++;
    logEvent('map_refined', { mode: 'recorded', round: S.refineRound });
    return render();
  }

  const locked = [];
  walk(S.map, n => { if (n.locked) locked.push(n.label); });
  await guarded('Reworking the map around your answer', async () => {
    const out = await askModel(
      PROMPTS.refine(S.brief, JSON.stringify(stripForPrompt(S.map)), { question: question, answer: answer }, locked),
      validateMap, { maxTokens: 6000 });
    snapshot();
    const keepCollapse = {};
    walk(S.map, n => { keepCollapse[n.id] = n.collapsed; });
    S.map = out.root;
    S.title = out.title || S.title;
    S.summary = out.summary || S.summary;
    if (Array.isArray(out.assumptions)) { S.assumptions = out.assumptions; S.resolvedAssumptions = []; }
    S.changeNote = out.changeNote || 'The map was rebuilt around your answer.';
    markDiff(before, S.map);
    relockFrom(before);
    walk(S.map, (n, d) => { n.collapsed = (n.id in keepCollapse) ? keepCollapse[n.id] : d >= 2 && (n.children || []).length > 0; });
    S.refineRound++;
    logEvent('map_refined', { mode: 'live', round: S.refineRound });
  });
}

/* a clarifying question answered on the map */
function answerQuestion(qid, answer) {
  const q = S.questions.filter(x => x.id === qid)[0];
  if (!q) return;
  S.answers[qid] = { answer: answer, skipped: false };
  return applyAnswer(q.question, answer, { kind: 'question', recorded: q.effect });
}
/* …or waved away, which is what creates a visible assumption */
function skipQuestion(qid) {
  const q = S.questions.filter(x => x.id === qid)[0];
  if (!q) return;
  S.answers[qid] = { answer: '', skipped: true };
  if (S.extraAssumptions.indexOf(q.assumeIfSkipped) < 0) S.extraAssumptions.push(q.assumeIfSkipped);
  logEvent('question_skipped', { q: qid });
  render();
}

function sameish(a, b) { return String(a).slice(0, 40).toLowerCase() === String(b).slice(0, 40).toLowerCase(); }
function stripForPrompt(node) {
  const c = clone(node);
  walk(c, n => { delete n.status; delete n.collapsed; delete n.vote; delete n.userTouched; });
  return c;
}
function relockFrom(before) {
  const locked = {};
  walk(before, n => { if (n.locked) locked[n.id] = true; });
  walk(S.map, n => { if (locked[n.id]) n.locked = true; });
}

async function deepen(nodeId) {
  const node = findNode(nodeId);
  if (!node) return;
  if (!isLive()) {
    const c = recordedCase(S.caseId);
    if (!c.deepen || c.deepen.nodeId !== nodeId) {
      S.error = {
        title: 'That branch has no recorded expansion',
        body: 'Recorded mode ships one expansion per example — the branch marked "expandable" in the inspector. Everything else here (editing, locking, undo, export) works on any node.',
        actions: [{ label: 'Close', act: 'dismiss' }]
      };
      return render();
    }
    snapshot();
    const before = clone(S.map);
    node.children = (node.children || []).concat(clone(c.deepen.children));
    node.collapsed = false;
    markDiff(before, S.map);
    logEvent('branch_deepened', { mode: 'recorded', node: nodeId });
    return render();
  }
  const path = [];
  walk(S.map, (n, d, p) => { if (n.id === nodeId) { let cur = n; while (cur) { path.unshift(cur.label); cur = findParent(cur.id); } } });
  await guarded('Expanding "' + node.label + '"', async () => {
    const out = await askModel(PROMPTS.deepen(S.brief, node.label, path), validateChildren, { maxTokens: 1800 });
    snapshot();
    const before = clone(S.map);
    node.children = (node.children || []).concat(out.children);
    node.collapsed = false;
    markDiff(before, S.map);
    logEvent('branch_deepened', { mode: 'live', node: nodeId });
  });
}

/* ── failure handling: every call funnels through here ────── */
async function guarded(what, fn) {
  S.busy = { what: what }; S.error = null; render();
  try {
    await fn();
    S.busy = null; render();
  } catch (e) {
    S.busy = null;
    S.error = failureCard(e);
    logEvent('failure', { kind: e.kind || 'unknown', message: String(e.message).slice(0, 200) });
    render();
  }
}
function failureCard(e) {
  const retry = { label: 'Try again', act: 'retry' };
  const recorded = { label: 'Use a recorded example instead', act: 'to-brief' };
  switch (e.kind) {
    case 'auth': return { title: 'That API key was rejected',
      body: 'Anthropic returned 401. Check the key is a valid API key (it starts with sk-ant-) and has credit, then try again.',
      actions: [{ label: 'Open settings', act: 'settings' }, recorded] };
    case 'timeout': return { title: 'The model took too long',
      body: 'No reply within 90 seconds. A smaller model usually fixes this — or try again, since long waits are often transient.',
      actions: [retry, { label: 'Switch model', act: 'settings' }, recorded] };
    case 'network': return { title: 'Could not reach the API',
      body: 'The request never left the browser. If you opened this file directly, serve it instead (python3 -m http.server), since file:// pages are blocked from calling the API.',
      actions: [retry, recorded] };
    case 'unusable': return { title: 'The model replied, but not with a usable map',
      body: 'Three attempts came back malformed. This is usually a too-small model or a brief that is pulling in several directions at once. Your brief and answers are still here.',
      actions: [retry, { label: 'Switch model', act: 'settings' }, recorded] };
    default: return { title: 'Something went wrong on that step',
      body: String(e.message || e).slice(0, 240) + ' — nothing was lost; your brief, answers and map are all still here.',
      actions: [retry, recorded] };
  }
}
let lastAction = null;
function remember(fn) { lastAction = fn; return fn; }

/* ── exports ──────────────────────────────────────────────── */
function toMarkdown() {
  const lines = ['# ' + (S.title || S.brief.topic), '', S.summary, ''];
  const assumps = assumptionsShown();
  if (assumps.length) {
    lines.push('**Assumptions this map rests on**', '');
    assumps.forEach(a => lines.push('- ' + a));
    lines.push('');
  }
  walk(S.map, (n, d) => {
    if (d === 0) return;
    const bits = [];
    if (n.source === 'assumption') bits.push('assumption');
    if (n.source === 'user') bits.push('from your answers');
    if (n.confidence !== 'medium') bits.push(n.confidence + ' confidence');
    lines.push('  '.repeat(d - 1) + '- **' + n.label + '**' + (bits.length ? ' _(' + bits.join(', ') + ')_' : ''));
    if (n.why) lines.push('  '.repeat(d) + '- _why:_ ' + n.why);
    (n.alternatives || []).forEach(a => lines.push('  '.repeat(d) + '- _alternative:_ ' + a.label + ' — ' + a.tradeoff));
    (n.probes || []).forEach(p => lines.push('  '.repeat(d) + '- _open question:_ ' + p));
  });
  lines.push('', '---', 'Generated by Probe ' + PROMPTS.VERSION + ' (' + (isLive() ? 'live, ' + S.model : 'recorded run') + '). Model knowledge, not live research — verify before acting.');
  return lines.join('\n');
}
function toMermaid() {
  const lines = ['mindmap'];
  const safe = s => String(s).replace(/[()[\]{}"]/g, '').slice(0, 70);
  walk(S.map, (n, d) => {
    const text = d === 0 ? 'root((' + safe(n.label) + '))' : safe(n.label);
    lines.push('  '.repeat(d + 1) + text);
  });
  return lines.join('\n');
}
function toJson() {
  return JSON.stringify({
    generator: 'Probe ' + PROMPTS.VERSION, mode: isLive() ? 'live' : 'recorded',
    model: isLive() ? S.model : 'recorded-' + S.caseId, generatedAt: now(),
    brief: S.brief, title: S.title, summary: S.summary, assumptions: assumptionsShown(),
    answers: S.questions.map(q => ({ question: q.question, answer: (S.answers[q.id] || {}).answer || null, assumedInstead: (S.answers[q.id] || {}).answer ? null : q.assumeIfSkipped })),
    map: stripForPrompt(S.map)
  }, null, 2);
}
function toSessionLog() {
  return JSON.stringify({ promptVersion: PROMPTS.VERSION, mode: isLive() ? 'live' : 'recorded', brief: S.brief, events: S.log }, null, 2);
}
function currentPrompt() {
  const answers = S.questions.map(q => ({ question: q.question, answered: !!(S.answers[q.id] || {}).answer, answer: (S.answers[q.id] || {}).answer || '', assumeIfSkipped: q.assumeIfSkipped }));
  return 'SYSTEM\n──────\n' + PROMPTS.SYSTEM + '\n\nUSER (map step)\n──────\n' + PROMPTS.buildMap(S.brief, answers);
}
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); }
    catch (e2) { toast('Copy failed — select the text and copy manually'); }
    ta.remove();
  }
}
/* ─────────────────────────────────────────────────────────────
   Probe — rendering and interaction
   ───────────────────────────────────────────────────────────── */

const STEPS = [
  { key: 'brief', n: '1', label: 'Brief' },
  { key: 'map', n: '2', label: 'Map & refine' }
];

function stepState(key) {
  const current = S.screen === 'clarify' ? 'brief' : S.screen;
  const order = ['brief', 'map'];
  const i = order.indexOf(key), j = order.indexOf(current);
  return i === j ? 'now' : (i < j ? 'done' : 'todo');
}

function markLogo() {
  return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="3" fill="var(--probe)"/>' +
    '<circle cx="12" cy="12" r="7" stroke="var(--probe)" stroke-width="1.2" opacity=".55"/>' +
    '<circle cx="12" cy="12" r="10.6" stroke="var(--probe)" stroke-width="1" opacity=".28"/>' +
    '<line x1="12" y1="12" x2="21" y2="6" stroke="var(--probe)" stroke-width="1.2"/>' +
    '<circle cx="21" cy="6" r="1.8" fill="var(--amber)"/></svg>';
}

function topbar() {
  const modeChip = LIVE_BLOCKED
    ? '<span class="chip chip--recorded" title="Shared previews cannot call an API, so this session replays saved runs">recorded run</span>'
    : (isLive()
      ? '<span class="chip chip--live" title="Calling the Anthropic API with your key">live · ' + esc(S.model.replace('claude-', '').replace('-20251001', '')) + '</span>'
      : '<span class="chip chip--recorded" title="No API key set — replaying saved runs">recorded run</span>');

  const tools = [];
  if (S.screen === 'map') {
    tools.push(btn('undo', '↺ Undo', { disabled: !S.history.length, title: 'Undo the last change to the map' }));
    tools.push(btn('redo', '↻ Redo', { disabled: !S.future.length }));
    tools.push(btn('export', '↗ Export', { primary: false }));
  }
  tools.push(btn('settings', '⚙ Settings'));
  tools.push(btn('theme', 'Theme', { title: 'Switch light / dark / follow system', ghost: true, sm: true }));
  if (S.screen !== 'brief') tools.push(btn('restart', 'New map', { ghost: true }));

  return '<header class="topbar">' +
    '<div class="brandmark">' + markLogo() + '<div><b>Probe</b> <span>mind-map agent</span></div></div>' +
    '<nav class="stepper" aria-label="Progress">' +
    STEPS.map((s, i) => (i ? '<span class="stepper__sep">›</span>' : '') +
      '<span class="stepper__item stepper__item--' + stepState(s.key) + '"><b>' + s.n + '</b> ' + s.label + '</span>').join('') +
    '</nav>' +
    '<div class="topbar__spacer"></div>' +
    '<div class="topbar__tools">' + modeChip + tools.join('') + '</div>' +
